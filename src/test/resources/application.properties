## Test application for the messaging library. Lives in test sources only, never shipped.
app.code=msg
app.name=Messaging test app
app.description=Messaging library test application

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.4.0-management-alpine

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=messaging
quarkus.hibernate-orm.database.default-schema=messaging

quarkus.keycloak.devservices.enabled=false
quarkus.oidc.tenant-enabled=false

# tenancy: discriminator column, every session needs a tenant (fail-closed resolver in common)
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# probe consumer: incoming channel bound to the library's own exchange (quorum queue, dead-letter queue, reject on failure)
mp.messaging.incoming.probe-in.connector=smallrye-rabbitmq
mp.messaging.incoming.probe-in.exchange.name=nexo.${app.code}
mp.messaging.incoming.probe-in.exchange.type=topic
mp.messaging.incoming.probe-in.exchange.durable=true
mp.messaging.incoming.probe-in.queue.name=msg.probe
mp.messaging.incoming.probe-in.queue.durable=true
mp.messaging.incoming.probe-in.queue.x-queue-type=quorum
mp.messaging.incoming.probe-in.routing-keys=probe.#
mp.messaging.incoming.probe-in.auto-bind-dlq=true
mp.messaging.incoming.probe-in.dlx.declare=true
mp.messaging.incoming.probe-in.failure-strategy=reject
mp.messaging.incoming.probe-in.max-outstanding-messages=10
