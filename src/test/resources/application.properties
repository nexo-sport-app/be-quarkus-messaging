## Test application for the messaging library. Lives in test sources only, never shipped.
app.code=msg
app.name=Messaging test app
app.description=Messaging library test application

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.4.0-management-alpine

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=messaging
quarkus.hibernate-orm.database.default-schema=messaging

quarkus.keycloak.devservices.enabled=false
quarkus.oidc.tenant-enabled=false

# tenancy: discriminator column, every session needs a tenant (fail-closed resolver in common)
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified
