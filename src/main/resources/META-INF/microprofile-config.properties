# Library defaults for the Nexo messaging library. Services supply the broker location, credentials and app.code.

# Outgoing channel used by the outbox relay: topic exchange per service, durable, broker-confirmed publishing
mp.messaging.outgoing.nexo-outbox.connector=smallrye-rabbitmq
mp.messaging.outgoing.nexo-outbox.exchange.name=nexo.${app.code}
mp.messaging.outgoing.nexo-outbox.exchange.type=topic
mp.messaging.outgoing.nexo-outbox.exchange.durable=true
mp.messaging.outgoing.nexo-outbox.publish-confirms=true

# Incoming channels activate the CDI request context so tenant-scoped code works inside consumers.
# Quarkus 3.37.4 ships a built-in RequestScopedDecorator that already does this; the key is kept as an explicit
# statement of intent (fallback if ever needed: @ActivateRequestContext on consumer methods, RESEARCH A6).
quarkus.messaging.request-scoped.enabled=true
